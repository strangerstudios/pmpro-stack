---
# Installs fail2ban and deploys the custom jail.local config plus WordPress jails.
# jail.local overrides defaults from jail.conf without modifying the upstream file,
# so package updates won't clobber our settings.

- name: Installing Fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
  register: package_install
  tags: fail2ban

- name: Copying Fail2ban Configuration File
  ansible.builtin.copy:
    src: jail.local
    dest: "/etc/fail2ban/jail.local"
    owner: root
    group: root
    mode: "0644"
  notify: service fail2ban restart
  tags: fail2ban, fail2ban_config

# Behind Cloudflare, packet-level bans match the edge IP, never the attacker.
# pmpro-apache-deny (referenced from jail.local) bans the real client at the
# Apache layer; the helper renders the deny list into an Apache conf.
- name: Install the Apache deny-list helper
  ansible.builtin.copy:
    src: bin/pmpro-f2b-apache-deny
    dest: /usr/local/bin/pmpro-f2b-apache-deny
    owner: root
    group: root
    mode: "0755"
  notify: service fail2ban restart
  tags: fail2ban, fail2ban_config

- name: Deploy the Apache deny fail2ban action
  ansible.builtin.copy:
    src: action.d/pmpro-apache-deny.conf
    dest: /etc/fail2ban/action.d/pmpro-apache-deny.conf
    owner: root
    group: root
    mode: "0644"
  notify: service fail2ban restart
  tags: fail2ban, fail2ban_config

# WordPress jails: rate-limit POSTs to wp-login.php and wp-comments-post.php
# per IP, ban webshell/secret probes, 404 floods, and admin-surface recon.
- name: Deploy WordPress fail2ban filters
  ansible.builtin.copy:
    src: "filter.d/{{ item }}"
    dest: "/etc/fail2ban/filter.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - wordpress-login-brute.conf
    - wordpress-spam.conf
    - wordpress-webshell.conf
    - wordpress-credential-scan.conf
    - wordpress-404-flood.conf
    - wordpress-recon.conf
  notify: service fail2ban restart
  tags: fail2ban, fail2ban_config

- name: Deploy WordPress fail2ban jails
  ansible.builtin.copy:
    src: "jail.d/{{ item }}"
    dest: "/etc/fail2ban/jail.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - wordpress-login-brute.conf
    - wordpress-spam.conf
    - wordpress-webshell.conf
    - wordpress-credential-scan.conf
    - wordpress-404-flood.conf
    - wordpress-recon.conf
  notify: service fail2ban restart
  tags: fail2ban, fail2ban_config
