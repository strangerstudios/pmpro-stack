# 404-flood jail
#
# Bans IPs generating sustained 404 floods (path enumeration / plugin
# scanning). Static-asset 404s are excluded by the filter, so a page with
# broken images never counts toward a ban.
#
# The threshold is intentionally far above ordinary browsing and crawler
# traffic, and the filter does not count missing static assets.
#
# Deployment:
#   sudo cp filter.d/wordpress-404-flood.conf /etc/fail2ban/filter.d/
#   sudo cp jail.d/wordpress-404-flood.conf   /etc/fail2ban/jail.d/
#   sudo fail2ban-client reload
#   sudo fail2ban-client status wordpress-404-flood

[wordpress-404-flood]
enabled  = true
port     = http,https
filter   = wordpress-404-flood
logpath  = /var/log/apache2/*access.log
# Ban after 50 page 404s within 2 minutes.
maxretry = 50
findtime = 120
# Ban for 24 hours.
bantime  = 86400
