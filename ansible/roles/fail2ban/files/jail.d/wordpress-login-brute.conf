# WordPress login brute-force jail
#
# Rate-limits POST attempts against /wp-login.php per IP. Cloudflare's WAF
# rate-limit rule catches the high-volume floods at the edge, but origin still
# sees attempts from sources CF doesn't gate (proxied bots, direct IP hits,
# or anything where the customer hasn't put CF in front). This is the
# server-side belt to that CF suspenders.
#
# Tuned to not bother real users: the filter counts non-redirect POSTs only
# (successful-login 302s contribute zero), and the threshold mirrors PMPro
# core's spam gate (includes/spam.php: 10 actions / 900s), which likewise
# counts failures. A fumbling admin's typo + retry stays far under 10 failures
# in 15 minutes; credential stuffing does not. WordPress's session-expired
# reauth modal and some 2FA plugins return 200 on success too, so the higher
# threshold also absorbs a burst of those from one shared office/classroom IP.
#
# Deployment:
#   sudo cp filter.d/wordpress-login-brute.conf /etc/fail2ban/filter.d/
#   sudo cp jail.d/wordpress-login-brute.conf   /etc/fail2ban/jail.d/
#   sudo fail2ban-client reload
#   sudo fail2ban-client status wordpress-login-brute

[wordpress-login-brute]
enabled  = true
port     = http,https
filter   = wordpress-login-brute
logpath  = /var/log/apache2/*access.log
# Ban after 10 failed wp-login POSTs within 15 minutes.
maxretry = 10
findtime = 900
# Ban for 24 hours.
bantime  = 86400
