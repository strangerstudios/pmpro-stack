# WordPress admin/login recon jail
#
# Bans IPs probing the admin surface: logged-out wp-admin scanning (302 redirects)
# and admin-ajax hits against known exploit/recon action names. Complements
# wordpress-login-brute (credential stuffing) — this catches the recon that
# usually precedes it. General content scraping is intentionally NOT matched;
# high-volume 404 fuzzing is handled by wordpress-404-flood.
#
# Both failregex lines feed one per-IP counter against the single maxretry below —
# fail2ban has no per-line threshold. The admin-ajax denylist actions (line 2) are
# never legitimate and would warrant a tight trigger on their own; the GET|HEAD
# wp-admin 302 scan (line 1) is noisier, so the shared threshold is a compromise.
# Split into two jails if you want a tighter ajax trigger without loosening line 1.
#
# Requires real client IP at the origin. The bundled mod_remoteip configuration
# restores it for Cloudflare-proxied requests; otherwise proxy edge addresses
# could be matched. The jail uses the local firewall action configured by
# fail2ban.
#
# Deployment:
#   sudo cp filter.d/wordpress-recon.conf /etc/fail2ban/filter.d/
#   sudo cp jail.d/wordpress-recon.conf   /etc/fail2ban/jail.d/
#   sudo fail2ban-client reload
#   sudo fail2ban-client status wordpress-recon

[wordpress-recon]
enabled  = true
port     = http,https
filter   = wordpress-recon
logpath  = /var/log/apache2/*access.log
# Ban after 15 probe hits within 10 minutes.
maxretry = 15
findtime = 600
# Ban for 24 hours.
bantime  = 86400
