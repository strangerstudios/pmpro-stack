# WordPress webshell-probe jail
#
# Bans IPs probing for dropped PHP shells (direct hits on top-level .php
# files that aren't legitimate WP entry points). Pairs with server-level
# uploads/ PHP execution blocks: those return the 403, this bans the prober
# so the enumeration stops.
#
# Deployment:
#   sudo cp filter.d/wordpress-webshell.conf /etc/fail2ban/filter.d/
#   sudo cp jail.d/wordpress-webshell.conf   /etc/fail2ban/jail.d/
#   sudo fail2ban-client reload
#   sudo fail2ban-client status wordpress-webshell

[wordpress-webshell]
enabled  = true
port     = http,https
filter   = wordpress-webshell
logpath  = /var/log/apache2/*access.log
# Ban after 3 shell probes within 10 minutes.
maxretry = 3
findtime = 600
# Ban for 7 days — webshell probing is never legitimate.
bantime  = 604800
