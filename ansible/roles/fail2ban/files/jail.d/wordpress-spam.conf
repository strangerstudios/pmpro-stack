# WordPress comment spam jail
#
# Rate-limits comment submissions per IP. Catches repeat offenders that slip
# through Cloudflare WAF — e.g. bots that solve challenges and try again.
#
# Deployment:
#   sudo cp filter.d/wordpress-spam.conf /etc/fail2ban/filter.d/
#   sudo cp jail.d/wordpress-spam.conf   /etc/fail2ban/jail.d/
#   sudo fail2ban-client reload
#   sudo fail2ban-client status wordpress-spam

[wordpress-spam]
enabled  = true
port     = http,https
filter   = wordpress-spam
logpath  = /var/log/apache2/*_access.log
# Ban after 3 comment POSTs within 2 minutes.
maxretry = 3
findtime = 120
# Ban for 24 hours.
bantime  = 86400
