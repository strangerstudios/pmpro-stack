# Credential/secret-scan jail
#
# Bans IPs probing for .env, .git/config, .aws credentials, debug.log, and
# similar secret-bearing paths. Server-level Apache deny rules cover these
# files; this bans the scanner so the probing stops at two hits.
#
# Deployment:
#   sudo cp filter.d/wordpress-credential-scan.conf /etc/fail2ban/filter.d/
#   sudo cp jail.d/wordpress-credential-scan.conf   /etc/fail2ban/jail.d/
#   sudo fail2ban-client reload
#   sudo fail2ban-client status wordpress-credential-scan

[wordpress-credential-scan]
enabled  = true
port     = http,https
filter   = wordpress-credential-scan
logpath  = /var/log/apache2/*access.log
# Two secret-path probes within 5 minutes is a scanner, not a typo.
maxretry = 2
findtime = 300
# Ban for 7 days.
bantime  = 604800
