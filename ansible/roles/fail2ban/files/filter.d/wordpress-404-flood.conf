[Definition]
# 404 flood: an IP hammering nonexistent URLs is enumerating (plugin scans,
# path brute-force), not browsing. The threshold leaves ample room for normal
# browsing and legitimate crawlers.
failregex = ^<HOST> .* "(GET|POST|HEAD) .* HTTP/.*" 404

# Don't count 404s for static assets — broken images/CSS are normal. (?i) so
# uploads preserving camera names (IMG_0001.JPG) are excluded too.
# Anchored to the request path before the query string: an unanchored match
# would exclude a flood request merely because ".js" appears in its query
# string, referrer, or user-agent.
ignoreregex = (?i)^<HOST> .* "(GET|HEAD) [^"?]+\.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|map)(\?[^"]*)? HTTP
