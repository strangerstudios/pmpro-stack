[Definition]
# Match POST requests to /wp-login.php on FAILED-login response codes.
# Core WordPress re-renders the form with a 200 on a failed login; security
# plugins may use 401/403. 302 is deliberately NOT counted — that's the
# successful-login redirect, and counting it lets five people behind one
# shared NAT logging in normally ban their office IP for a day.
# Real users rarely fail more than once or twice in a row;
# credential-stuffing bots POST hundreds in a few minutes.
failregex = ^<HOST>.*"POST /wp-login\.php(?:\?[^ ]*)? HTTP/.*" (200|401|403)
