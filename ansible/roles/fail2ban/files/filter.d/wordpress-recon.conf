[Definition]
# Detect admin-surface probing while leaving legitimate traffic untouched.
#
# Line 1 — unauthenticated wp-admin scanning: a logged-out walk of /wp-admin/
# returns 302 (redirect to login). Scoped to GET|HEAD on purpose: logged-in admins
# get 200 on page GETs but 302 on POST write actions (post/settings saves, bulk
# actions), so matching POST would ban routine admin work — a shop manager editing
# orders or a moderator clearing a queue can exceed the threshold, and mod_remoteip
# means the real (often shared-NAT) admin IP takes the ban. GET|HEAD preserves the
# scanner signal (recon walks the admin surface with GETs) without those false
# positives. admin-ajax.php is excluded — it has a public (nopriv) surface and is
# the cron/heartbeat workhorse. Residual: GET admin-action links (e.g.
# plugins.php?action=activate) still 302 for admins; add known admin IPs to
# ignoreip in jail.local if a site trips it.
#
# Line 2 — admin-ajax probing by known recon action names. This is a DENYLIST of
# exploit/recon actions, never a frequency rule: the busiest admin-ajax action on
# a live site is Action Scheduler's as_async_request_queue_runner (legitimate),
# which must never match. Only actions explicitly listed here count. Curate this
# list as new probe patterns appear in the wild; action is matched in the query
# string (recon tooling commonly passes it as GET).
failregex = ^<HOST>.*"(?:GET|HEAD) /wp-admin/(?!admin-ajax\.php)[^"]*" 302
            ^<HOST>.*"(?:GET|POST|HEAD) /wp-admin/admin-ajax\.php\?[^"]*\baction=(?:revslider_ajax_action|revolution-slider|duplicator_download|wpfilemanager|fmu_get_file|connector|cherry_handler|nd_learning_get_state|loginizer|wp_cve|jet_engine|jet_smart_filters|elementor_ajax|getmyfileuploaded)\b[^"]*"
# Ignore: nonce-carrying admin form redirects. WP admin search/filter form GETs
# (for example, PMPro Members List searches)
# 302-redirect to a clean URL carrying _wpnonce, so a working admin trips line 1
# within maxretry.
# Recon walks are logged out and do not carry nonces, so nonce'd wp-admin GETs
# are ignored. Trade-off: a scanner appending a fake _wpnonce evades line 1 only;
# the credential-scan/webshell/404-flood jails and the CF WAF layer still apply.
# Nonce-less admin-action links (plugins.php?action=...) remain the residual
# noted above; ignoreip in jail.local is still the escape hatch.
ignoreregex = "(?:GET|HEAD) /wp-admin/[^"]*[?&]_wpnonce=[0-9a-fA-F]+[^"]*" 302
