[Definition]
# Strip an optional `host:port ` prefix (vhost_combined lines in
# other_vhosts_access.log) so <HOST> is the client, never the vhost name.
prefregex = ^(?:[\w.-]+:\d+ )?<F-CONTENT>.+</F-CONTENT>$
# Requests probing for credentials, secrets, and config files. No legitimate
# user requests /.aws/credentials or /.git/config. Promoted from field
# hardening on a live membership site.
#
# (?i) on every line: probe intent is what's being matched, and scanners mix
# case. GET|HEAD: recon tooling commonly uses HEAD to stay quiet. The /.env
# prefix is deliberately unanchored at the end — /.env.local, /.env.backup,
# /.env.production are all real probe targets.
failregex = (?i)^<HOST> .* "(GET|HEAD) /\.env
            (?i)^<HOST> .* "(GET|HEAD) /\.aws
            (?i)^<HOST> .* "(GET|HEAD) /\.git/(config|HEAD|index|logs|packed-refs|info)
            (?i)^<HOST> .* "(GET|HEAD) /\.git-credentials
            (?i)^<HOST> .* "(GET|HEAD) /\.gitignore
            (?i)^<HOST> .* "(GET|HEAD) /\.docker
            (?i)^<HOST> .* "(GET|HEAD) /\.azure
            (?i)^<HOST> .* "(GET|HEAD) /\.gcloud
            (?i)^<HOST> .* "(GET|HEAD) /\.keys/
            (?i)^<HOST> .* "(GET|HEAD) /\.circleci
            (?i)^<HOST> .* "(GET|HEAD) /\.gitlab-ci
            (?i)^<HOST> .* "(GET|HEAD) /\.github/workflows
            (?i)^<HOST> .* "(GET|HEAD) /\.mailer
            (?i)^<HOST> .* "(GET|HEAD) /\.mailgun
            (?i)^<HOST> .* "(GET|HEAD) /\.sendgrid
            (?i)^<HOST> .* "(GET|HEAD) /\.netrc
            (?i)^<HOST> .* "(GET|HEAD) /~[a-zA-Z0-9_.-]+
            (?i)^<HOST> .* "(GET|HEAD) /wp-content/debug\.log
            (?i)^<HOST> .* "(GET|HEAD) /wp-content/uploads/debug\.log
            (?i)^<HOST> .* "(GET|HEAD) /wp-content/uploads/logs/debug\.log
            (?i)^<HOST> .* "(GET|HEAD) /wp-content/.+/(stripe-keys|stripe-config|config|credentials)\.php
            (?i)^<HOST> .* "(GET|HEAD) /wp-content/uploads/.+(credentials|aws|keys|config)\.json
            (?i)^<HOST> .* "(GET|HEAD) /(config|sendgrid|mailgun|sparkpost|stripe)\.env
            (?i)^<HOST> .* "(GET|HEAD) /zeit\.json
            (?i)^<HOST> .* "POST /RSC/

ignoreregex =
