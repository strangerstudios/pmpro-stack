[Definition]
# Requests probing for credentials, secrets, and config files. No legitimate
# user requests /.aws/credentials or /.git/config. Promoted from field
# hardening on a live membership site.
failregex = ^<HOST> .* "GET /\.env
            ^<HOST> .* "GET /\.aws
            ^<HOST> .* "GET /\.git/(config|HEAD|index|logs|packed-refs|info)
            ^<HOST> .* "GET /\.git-credentials
            ^<HOST> .* "GET /\.gitignore
            ^<HOST> .* "GET /\.docker
            ^<HOST> .* "GET /\.azure
            ^<HOST> .* "GET /\.gcloud
            ^<HOST> .* "GET /\.keys/
            ^<HOST> .* "GET /\.circleci
            ^<HOST> .* "GET /\.gitlab-ci
            ^<HOST> .* "GET /\.github/workflows
            ^<HOST> .* "GET /\.mailer
            ^<HOST> .* "GET /\.mailgun
            ^<HOST> .* "GET /\.sendgrid
            ^<HOST> .* "GET /\.netrc
            ^<HOST> .* "GET /~/.+
            ^<HOST> .* "GET /wp-content/debug\.log
            ^<HOST> .* "GET /wp-content/uploads/debug\.log
            ^<HOST> .* "GET /wp-content/uploads/logs/debug\.log
            ^<HOST> .* "GET /wp-content/.+/(stripe-keys|stripe-config|config|credentials)\.php
            ^<HOST> .* "GET /wp-content/uploads/.+(credentials|aws|keys|config)\.json
            ^<HOST> .* "GET /(config|sendgrid|mailgun|sparkpost|stripe)\.env
            ^<HOST> .* "GET /zeit\.json
            ^<HOST> .* "POST /RSC/

ignoreregex =
