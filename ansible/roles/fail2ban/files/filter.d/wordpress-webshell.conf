[Definition]
# Webshell probing: direct GET/POST to a top-level .php file that is not a
# legitimate WordPress entry point. Real traffic goes through index.php,
# wp-login.php, wp-cron.php, xmlrpc.php, wp-comments-post.php, the multisite
# signup/activate endpoints, or wp-admin/; bots probing for dropped shells
# request /shell.php, /wso.php, /alfa.php, /randomname.php, etc.
#
# Promoted from field hardening on a live membership site; the exclusion list
# was widened for canon (wp-comments-post.php, wp-signup.php, wp-activate.php,
# wp-trackback.php, wp-links-opml.php, wp-mail.php) so legitimate commenters,
# signups, trackbacks, and post-by-email never count toward a ban. (?i) so a
# dropped Shell.PHP still matches.
#
# Each excluded entry point must be the ENTIRE path segment (followed by "?",
# a space, or a quote in the log line) — a bare prefix exclusion would let
# /index.php.shell.php or /wp-login.php.bak.php slide past the filter.
failregex = (?i)^<HOST> - - \[.*\] "(GET|POST|HEAD) /(?!(?:index\.php|wp-login\.php|wp-cron\.php|xmlrpc\.php|wp-comments-post\.php|wp-signup\.php|wp-activate\.php|wp-trackback\.php|wp-links-opml\.php|wp-mail\.php)(?:[?\s"/])|wp-admin/)[a-zA-Z0-9_.-]+\.php

ignoreregex =
