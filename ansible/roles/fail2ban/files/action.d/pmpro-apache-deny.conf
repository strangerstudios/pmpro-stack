# Bans at the Apache authorization layer instead of the packet layer.
#
# pmpro-stack sites sit behind Cloudflare by default. mod_remoteip rewrites the client IP
# from CF-Connecting-IP, so fail2ban's filters read (and ban) the real client
# address — but iptables/nftables match the packet source, which is always a
# Cloudflare edge IP. The ban is recorded and never enforced.
#
# This action writes the banned addresses into an Apache Location block, which
# is evaluated after mod_remoteip has substituted the real client IP.
#
# Pairs with, rather than replaces, the packet-level banaction: that one still
# covers attackers who hit the origin IP directly, bypassing Cloudflare.
#
# All HTTP jails share one deny list, so entries carry the jail name and are
# reference-counted. actionstop clears only this jail's records; a bare flush
# would drop bans the other jails still hold.

[Definition]

actionstart = /usr/local/bin/pmpro-f2b-apache-deny render

actionstop = /usr/local/bin/pmpro-f2b-apache-deny clear <name>

actioncheck =

actionban = /usr/local/bin/pmpro-f2b-apache-deny add <name> <ip>

actionunban = /usr/local/bin/pmpro-f2b-apache-deny del <name> <ip>

[Init]
