# pmpro-stack request timeout, pinned to the FPM hard wall. Managed by Ansible.
# Ubuntu's apache2.conf already ships Timeout 300, which matches the www pool's
# request_terminate_timeout (300s) - Apache and FPM cut at the same point. We pin
# it explicitly so every host converges: Apache's compiled-in 60s default would
# race a full 60s PHP request and sever the socket first.
# Do NOT lower this to a value under request_terminate_timeout: Apache would cut
# long jobs that legitimately lift the 60s soft limit with set_time_limit()
# (for example, media batch jobs) while FPM was still working.
Timeout 300
ProxyTimeout 300
