# Additional security rules for WordPress sites
# These rules are designed to block common attack vectors for WordPress sites,
# such as comment spam and bots trying to access the site without proper
# referrers or user agents. Adjust these rules as needed for your specific
# site and security requirements.

# Add this file in etc/apache2/conf-available/ and then enable it with a2enconf wordpress-protection,
# e.g. a2enconf wordpress-protection && apache2ctl configtest && systemctl reload apache2

# Never serve backup / dump / secret artifacts.
#
# These are SERVER-CONTEXT mod_rewrite rules on purpose: they run before any
# per-directory (.htaccess) processing, so an attacker-dropped .htaccess
# cannot grant them back. A <FilesMatch> "Require all denied" would NOT be
# safe here — under AllowOverride All (which WordPress permalinks need), a
# nested .htaccess replaces the authorization for its subtree.
#
# INHERITANCE IS REQUIRED: VirtualHosts do NOT inherit main-server rewrite
# rules on their own, and every request on a provisioned box is served by a
# vhost. InheritDownBefore pushes these rules into every vhost AHEAD of the
# vhost's own rules (plain InheritDown would append them, letting an earlier
# terminating rule bypass the deny). Each serving vhost still needs its own
# `RewriteEngine On` — engine state is never inherited; the ssl role's vhost
# template sets it. Keep that directive if you hand-edit the vhost.
#
# All patterns are (?i) case-insensitive so Backup.SQL / dump.BAK /
# WP-Config.php.bak variants are covered too.
RewriteEngine On
RewriteOptions InheritDownBefore

# Hidden files and directories can expose source control metadata, cloud
# credentials, and local tool configuration. Keep the ACME challenge path
# available for certificate issuance.
RewriteRule (?i)(^|/)\.(?!well-known(?:/|$)) - [F]

# Any wp-config.php.* variant (wp-config.php.bak, .bak-pre-dedupe, .orig, ...)
RewriteRule (?i)^/.*wp-config\.php\. - [F]

# Editor / backup / temp leftovers
RewriteRule (?i)\.(log|sql|bak|old|orig|save|swp)$ - [F]

# Compressed database dumps (db.sql.gz class)
RewriteRule (?i)\.sql\.(gz|bz2|xz|zip)$ - [F]

# Site archive dumps (tar family only). Single-format compressed files
# (zip/rar/7z/gz/bz2) deliberately NOT blocked: membership sites
# legitimately serve those as member downloads. Compressed DB dumps stay
# blocked above regardless of format (.sql.bz2 etc.).
RewriteRule (?i)\.(tar|tar\.gz|tgz|tar\.bz2|tbz2|tar\.xz|txz)$ - [F]

# Config / secret files, including every *.lock: composer.lock /
# yarn.lock / Gemfile.lock / poetry.lock at a docroot all fingerprint exact
# dependency versions for targeted exploits.
RewriteRule (?i)\.(env|ini|yml|yaml|toml|conf|cfg|secret|key|pem|lock)$ - [F]

# Databases and tool dotfile formats
RewriteRule (?i)\.(db|sqlite|pypirc|npmrc|yarnrc|netrc|gitconfig|dockerignore|condarc|boto|git-credentials)$ - [F]

# Home-directory traversal probes (/~/.aws/credentials and friends).
RewriteRule (?i)(^|/)~/ - [F]

# Credential JSON/JS and secret PHP config artifacts that scanners request by
# exact name. Whole-basename anchored so ordinary names like public_keys.json
# or professional-credentials.json still serve.
RewriteRule (?i)(^|/)((sendgrid|mailgun|mailjet|postmark|sparkpost|mandrill|ses)_keys|aws_credentials|credentials|zeit)\.json$ - [F]
RewriteRule (?i)(^|/)(aws_credentials\.js|stripe-keys\.php|stripe-config\.php)$ - [F]

# Sensitive PHP endpoints
RewriteRule (?i)^/.*(phpinfo|credentials|wp-config-backup|wp-config-sample|wp-configs)\.php$ - [F]

# No PHP execution from uploads: a vulnerable plugin that writes a shell into
# wp-content/uploads must not yield executable PHP. Enforced here (vhost
# phase, .htaccess cannot override) because the vhost's <FilesMatch \.php$>
# handler would otherwise happily proxy it to FPM.
RewriteRule (?i)^/wp-content/uploads/.*\.(php[0-9]?|phtml|phar)($|[/.]) - [F]

<Directory /var/www/>
    RewriteEngine On

    # Rule 1: The "Where did you come from?" Check
    # If a bot hits the comment file directly without coming from the site... Blocked.
    RewriteCond %{REQUEST_METHOD} POST
    RewriteCond %{REQUEST_URI} ^/wp-comments-post\.php
    RewriteCond %{HTTP_REFERER} !^https?://%{HTTP_HOST} [NC]
    RewriteRule ^ - [F,L]

    # Rule 2: The "Bot Signature" Check
    # Blocks common tools used to script spam (Python, curl, etc.)
    RewriteCond %{REQUEST_URI} ^/wp-comments-post\.php [NC]
    RewriteCond %{HTTP_USER_AGENT} (libwww-perl|python-requests|curl|Wget|Go-http-client|Java|GuzzleHttp) [NC]
    RewriteRule ^ - [F,L]
</Directory>
