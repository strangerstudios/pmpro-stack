# Cloudflare header check for wp-comments-post.php
# Restricts comment submissions to traffic coming through Cloudflare only,
# blocking bots that bypass Cloudflare and hit the origin server directly.
#
# Uses the CF-RAY header (added by Cloudflare to every proxied request) rather
# than IP ranges, because mod_remoteip rewrites the connecting IP to the real
# visitor IP before access control runs — making Require ip checks against CF
# ranges ineffective when RemoteIPTrustedProxy is configured.
#
# Add this block inside the <VirtualHost *:443> section of the site's vhost config,
# e.g. /etc/apache2/sites-enabled/<site>.conf
#
# Deployment checklist:
#   1. Add this block to the site's vhost config
#   2. Disable pingbacks and trackbacks in Settings → Discussion in wp-admin
#      (pingbacks are server-to-server POSTs to wp-comments-post.php — they will
#      be blocked by this rule as they don't have a CF-RAY header)

<Location /wp-comments-post.php>
    SetEnvIf CF-RAY ".+" via_cloudflare
    Require env via_cloudflare
</Location>
