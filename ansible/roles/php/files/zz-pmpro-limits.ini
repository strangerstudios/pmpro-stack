; pmpro-stack FPM execution-time default. Managed by Ansible.
; This raises the DEFAULT (was PHP's compiled-in 30s), not a hard cap — for
; max_execution_time only: code may still lift it with set_time_limit()/
; ini_set() for legitimate long jobs.
; max_input_time is PHP_INI_PERDIR and cannot be raised at runtime; the
; non-overridable wall for both is the pool's request_terminate_timeout
; (300s).
; FPM SAPI only (dropped in fpm/conf.d, not mods-available) so the CLI SAPI
; stays uncapped - long wp-cli migration/backup jobs must not be time-limited.
max_execution_time = 60
max_input_time = 60
